function camera(keys, t){

    const [t0,x0,y0,z0]=keys[i], [t1,x1,y1,z1]=keys[i+1];

    for(let c=c0;c<=c1;c++){
      const [s,w]=CELL[i][c]; if(!s) continue;
      if(c===14 && tp>0 && PILL[s]){ ctx.globalAlpha=alpha*tp; ctx.fillStyle=PILL[s]; ctx.beginPath(); ctx.roundRect(X[c]+PADX-12,y+14,w+24,RH-28,(RH-28)/2); ctx.fill(); ctx.globalAlpha=alpha; }
      if(big){ ctx.fillStyle='#1f2328'; ctx.fillText(s,X[c]+PADX,y+RH/2+2); } else { ctx.fillStyle='#c3c9d1'; ctx.fillRect(X[c]+PADX,y+RH/2-6,w,12); }
    }
  }
  const hl=HL.map(h=>({w:ease(prog(t,h.t,.7)), p:Math.min(1,prog(t,h.t,.25))*(1-ease(prog(t,h.end,.5))), x0:X[h.cols[0]], x1:X[h.cols[h.cols.length-1]+1]})).filter(h=>h.p>0);
  hl.forEach(h=>{ ctx.fillStyle=`rgba(${ACCENT_RGB},${.08*h.p})`; ctx.fillRect(h.x0,hy+HH,h.x1-h.x0,(th-hy-HH)*h.w); });
  // frozen header row, drawn over the rows
  if(hy>0){ ctx.shadowColor='rgba(20,30,40,.12)'; ctx.shadowBlur=12*z; ctx.shadowOffsetY=3*z; }
  ctx.fillStyle='#f6f8fa'; ctx.fillRect(0,hy,TW,HH); ctx.shadowColor='transparent';
  ctx.fillStyle='#d8dee4'; ctx.fillRect(0,hy,TW,line); ctx.fillRect(0,hy+HH-line/2,TW,line);
  for(const x of X) ctx.fillRect(x-line/2,hy,line,HH);
  hl.forEach(h=>{ ctx.fillStyle=`rgba(${ACCENT_RGB},${.18*h.p})`; ctx.fillRect(h.x0,hy,h.x1-h.x0,HH); });
  ctx.font=`bold ${FS}px Helvetica, Arial, sans-serif`;
  for(let c=c0;c<=c1;c++){
    ctx.fillStyle='#1f2328';
    if(big) ctx.fillText(HEAD[c],X[c]+PADX,hy+HH/2+2); else ctx.fillRect(X[c]+PADX,hy+HH/2-7,Math.min(200,X[c+1]-X[c]-2*PADX),14);
  }
  hl.forEach(h=>{ ctx.strokeStyle=`rgba(${ACCENT_RGB},${h.p})`; ctx.lineWidth=5/z; ctx.lineJoin='round'; ctx.strokeRect(h.x0,hy,h.x1-h.x0,HH+(th-hy-HH)*h.w); });
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1;
}

// ---------- the three dataset cuts, shown together ----------
const CFS = MOBILE?22:20, CRH = MOBILE?42:38, CPX = 16, TFS = MOBILE?25:28;
const pick = (rows, idx)=>rows.map(r=>idx.map(i=>r[i]));
const CARDS = MOBILE ? [
  {x:24, y:24, w:672, h:408, t:T.cuts+.5, title:'All oil cargo journeys', sub:`${NG} journeys in total \u00b7 journey 14 shown`,
   cols:['Date','Type','From','To'], widths:[160,90,191,191], rows:pick(CUTS.j14,[0,4,5,6]), pill:1},
  {x:24, y:448, w:672, h:380, t:T.cuts+1.0, title:'Oil trade volume by source and destination', sub:`${CUTS.oilsd.length} cargo legs \u00b7 feeds the sankey`,
   cols:['Journey','Origin','Destination','Barrels'], widths:[118,136,218,160], rows:CUTS.oilsd},
  {x:24, y:844, w:672, h:412, t:T.cuts+1.5, title:'Ship-to-ship transfer network', sub:`${CUTS.links.length} links between ships and ports`,
   cols:['Barrels','From (ship)','To ship / destination'], widths:[140,236,256], rows:CUTS.links},
] : [
  {x:40, y:40, w:1360, h:384, t:T.cuts+.5, title:'All oil cargo journeys', sub:`${NG} journeys in total \u00b7 journey 14 shown`,
   cols:['Date','Latitude','Longitude','Cargo Barrels','TransferType','From (ship)','To (ship or port)'], widths:[190,160,170,180,170,245,205], rows:CUTS.j14, pill:4},
  {x:40, y:444, w:670, h:596, t:T.cuts+1.0, title:'Oil trade volume by source and destination', sub:`${CUTS.oilsd.length} cargo legs \u00b7 feeds the sankey`,
   cols:['Journey','Oil origin','Oil Destination','Cargo Barrels'], widths:[118,140,206,174], rows:CUTS.oilsd},
  {x:730, y:444, w:670, h:596, t:T.cuts+1.5, title:'Ship-to-ship transfer network', sub:`${CUTS.links.length} links between ships and ports`,
   cols:['Cargo Barrels','From (ship)','To ship / destination'], widths:[180,224,234], rows:CUTS.links},
];
function drawCard(card, t){
  const p=ease(prog(t,card.t,.7)); if(p<=0 || !card.cells) return;
  ctx.save(); ctx.globalAlpha=p; ctx.translate(0,(1-p)*24);
  ctx.shadowColor='rgba(20,30,40,.10)'; ctx.shadowBlur=30; ctx.shadowOffsetY=8;
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.roundRect(card.x,card.y,card.w,card.h,20); ctx.fill(); ctx.shadowColor='transparent';
  ctx.beginPath(); ctx.roundRect(card.x,card.y,card.w,card.h,20); ctx.clip();
  ctx.textBaseline='middle'; ctx.fillStyle='#1f2328'; ctx.font=`bold ${TFS}px Helvetica, Arial, sans-serif`;
  ctx.fillText(card.title, card.x+20, card.y+38);
  ctx.fillStyle='#6e7781'; ctx.font='18px Helvetica, Arial, sans-serif'; ctx.fillText(card.sub, card.x+20, card.y+70);
  const tx=card.x+20, ty=card.y+96, tw=card.widths.reduce((a,b)=>a+b,0), xs=card.widths.reduce((a,w)=>(a.push(a[a.length-1]+w),a),[tx]);
  ctx.fillStyle='#f6f8fa'; ctx.fillRect(tx,ty,tw,CRH);
  ctx.font=`bold ${CFS}px Helvetica, Arial, sans-serif`; ctx.fillStyle='#1f2328';
  card.heads.forEach((s,c)=>ctx.fillText(s,xs[c]+CPX,ty+CRH/2+1));
  ctx.font=`${CFS}px Helvetica, Arial, sans-serif`;
  const maxRows=Math.floor((card.y+card.h-ty-CRH-8)/CRH)+1;
  card.cells.slice(0,maxRows).forEach((row,i)=>{
    const rp=ease(prog(t,card.t+.35+i*.04,.4)); if(rp<=0) return;
    const y=ty+CRH*(i+1)+(1-rp)*10; ctx.globalAlpha=p*rp;
    if(i%2){ ctx.fillStyle='#f9fafb'; ctx.fillRect(tx,y,tw,CRH); }
    ctx.fillStyle='#d8dee4'; ctx.fillRect(tx,y,tw,1.5);
    row.forEach(([s,w],c)=>{
      if(card.pill===c && PILL[s]){ ctx.fillStyle=PILL[s]; ctx.beginPath(); ctx.roundRect(xs[c]+CPX-8,y+7,w+16,CRH-14,(CRH-14)/2); ctx.fill(); }
      ctx.fillStyle='#1f2328'; ctx.fillText(s,xs[c]+CPX,y+CRH/2+1);
    });
  });
  ctx.globalAlpha=p;
  const tb=Math.min(card.y+card.h, ty+CRH*(1+card.cells.length)); ctx.fillStyle='#d8dee4'; xs.forEach(x=>ctx.fillRect(x-.75,ty,1.5,tb-ty)); ctx.fillRect(tx,tb-.75,tw,1.5); ctx.fillRect(tx,ty,tw,1.5); ctx.fillRect(tx,ty+CRH-.75,tw,1.5);
  // fade the bottom edge when a card holds more rows than fit
  if(card.cells.length>maxRows-1){ const g=ctx.createLinearGradient(0,card.y+card.h-90,0,card.y+card.h); g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(1,'#fff'); ctx.fillStyle=g; ctx.fillRect(card.x,card.y+card.h-90,card.w,90); }
  ctx.restore();
}

function render(t){
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle=PAGE; ctx.fillRect(0,0,W,H);
  const x=ease(prog(t,T.toTable,.9)), out=ease(prog(t,T.cuts,.7));
  drawTable(t,x*(1-out));
  drawPinpoint(t,1-x);
  CARDS.forEach(c=>drawCard(c,t));
}

window.READY=false;
const stage = document.getElementById('stage'), ctrl = stage.querySelector('.controls'), bar = ctrl.querySelector('progress');
stage.style.setProperty('--ar', W/H); C.width = W; C.height = H;
let playing = false, ended = false, userPaused = false, now = 0, last = 0, hideT = 0;
const showControls=()=>{ stage.classList.add('show-controls'); clearTimeout(hideT); hideT=setTimeout(()=>stage.classList.remove('show-controls'),1500); };
const updateBar=()=>{ const p=Math.min(1,now/DUR); ctrl.style.setProperty('--progress',p.toFixed(4)); bar.value=p; };
function setState(s){ stage.dataset.state=s; stage.setAttribute('aria-label', s==='playing'?'Pause animation':s==='ended'?'Replay animation':'Play animation'); }
// Plays once and stops on the last frame; the control then shows a replay icon.
function tick(ts){
  if(!playing) return;
  now=Math.min(DUR, now+Math.max(0,ts-last)/1000); last=ts; render(now); updateBar();
  if(now>=DUR){ playing=false; ended=true; setState('ended'); return; }
  requestAnimationFrame(tick);
}
function setPlaying(p){
  if(p===playing) return;
  if(p && ended){ ended=false; now=0; }
  playing=p; setState(p?'playing':'paused');
  if(p){ last=performance.now(); requestAnimationFrame(tick); }
}
function seek(t){ now=Math.max(0,Math.min(DUR,t)); if(ended && now<DUR){ ended=false; setState('paused'); } render(now); updateBar(); }
function toggle(){ if(ended){ userPaused=false; setPlaying(true); } else { userPaused=playing; setPlaying(!playing); } showControls(); }
// Tap or click toggles; dragging sideways across the animation scrubs, like the site's video player.
let downT=0, downX=0, downY=0, scrubbing=false, resume=false;
stage.addEventListener('pointerdown', e=>{ downT=performance.now(); downX=e.clientX; downY=e.clientY; scrubbing=false; showControls(); });
stage.addEventListener('pointermove', e=>{
  showControls();
  if(!downT) return;
  const dx=e.clientX-downX, dy=e.clientY-downY;
  if(!scrubbing && Math.abs(dx)>6 && Math.abs(dx)>Math.abs(dy)){ scrubbing=true; resume=playing; setPlaying(false); stage.setPointerCapture(e.pointerId); }
  if(scrubbing){ const r=stage.getBoundingClientRect(); seek(DUR*(e.clientX-r.left)/r.width); }
});
stage.addEventListener('pointerup', ()=>{
  const tap=!scrubbing && performance.now()-downT<300; downT=0;
  if(scrubbing){ scrubbing=false; if(resume) setPlaying(true); else userPaused=true; return; }
  if(tap) toggle();
});
stage.addEventListener('pointercancel', ()=>{ downT=0; scrubbing=false; });
stage.addEventListener('click', e=>{ if(e.detail===0) toggle(); });
stage.addEventListener('keydown', e=>{ if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ e.preventDefault(); seek(now+(e.key==='ArrowRight'?5:-5)); showControls(); } });
PIN.decode().catch(()=>{}).then(()=>document.fonts.ready).then(()=>{
  prepareText();
  window.READY = true;
  if(location.hash.includes('static')) return render(0);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ seek(DUR); ended=true; setState('ended'); return; }
  render(0); updateBar();
  // Play only while at least half the animation is on screen; this also works inside an iframe embed.
  new IntersectionObserver(([e])=>{ if(!userPaused && !ended) setPlaying(e.isIntersecting); }, {threshold:.5}).observe(stage);
});
</script>
