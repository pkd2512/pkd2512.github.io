// Each ship's length bar: grows in the table's bar column, flies to the ship's grid cell, then tilts into an isometric deck plate (breadth ignored).
function plate(sh, t){
  const xs=listCols(), y=listY(sh.i+1)+5, w0=rectW(sh)*st(t,'rects',sh.i,.02,.7), h0=L.list.rh-10, bx=xs[2]+14;
  const A=[[bx+w0,y],[bx+w0,y+h0],[bx,y+h0],[bx,y]];
  const [cx,cy]=cell(sh.i), w=rectW(sh), h=L.grid.bh;
  const F=[[cx+w/2,cy-h/2],[cx+w/2,cy+h/2],[cx-w/2,cy+h/2],[cx-w/2,cy-h/2]];
  const Lp=w/HX, Bp=L.grid.bp, P=(su,sv)=>[cx+U[0]*Lp/2*su+V[0]*Bp/2*sv, cy+U[1]*Lp/2*su+V[1]*Bp/2*sv];
  const I=[P(1,1),P(1,-1),P(-1,-1),P(-1,1)], pg=st(t,'grid',sh.i,.02,1.2), pi=st(t,'iso',sh.i,.02,1.2);
  return [A.map((p,k)=>{ const q=[lerp(p[0],F[k][0],pg), lerp(p[1],F[k][1],pg)]; return [lerp(q[0],I[k][0],pi), lerp(q[1],I[k][1],pi)]; }), pi];
}
function drawShips(t){
  const others = 1-ease(prog(t,T.focus,.8)), focA = 1-ease(prog(t,T.focus,.5));
  for(const sh of SL){
    if(!sh.len || t<T.rects) continue;
    const a = FOCUS[sh.name] ? focA : others; if(a<=0) continue;
    const [cs,pi] = plate(sh, t);
    ctx.fillStyle = mixRGB(NAVY, PLATE, pi, lerp(1,.75,pi)*a);
    ctx.beginPath(); cs.forEach(([x,y],k)=>k?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.closePath(); ctx.fill();
  }
  // tankers (already drawn isometric) are set down on the plates at one size, then scaled to their plate
  const order = SL.filter(s=>s.len).sort((a,b)=>shipPose(a,t)[1]-shipPose(b,t)[1]);
  for(const sh of order){
    const d = st(t,'land',sh.i,.02,.6); if(d<=0) continue;
    const a = d*(FOCUS[sh.name]?1:others); if(a<=0) continue;
    const [x,y,Lp] = shipPose(sh,t), sc = Lp/TK.len;
    ctx.globalAlpha=a; ctx.drawImage(TANK, x-TK.ax*sc, y-TK.ay*sc-(1-d)*40, TK.w*sc, TK.h*sc); ctx.globalAlpha=1;
  }
}
// The ship-length table; names and lengths fly to the grid with their bars.
let NAMES;
function prepareText(){ ctx.font=`${L.grid.fs}px ${FONT}`; NAMES = SL.map(s=>ctx.measureText(s.name).width); }
function drawChrome(t){
  const l=L.list, xs=listCols(), tw=xs[3]-l.x;
  ctx.textBaseline='middle';
  const ta = 1-ease(prog(t,T.grid,.5));
  if(ta>0) for(let r=0;r<=SL.length;r++){
    const a = st(t,'list',r,.025,.4)*ta; if(a<=0) continue;
    const y=listY(r)+(1-a/ta)*10; ctx.globalAlpha=a;
    ctx.fillStyle=r===0?'#f6f8fa':(r%2?'#fff':'#f9fafb'); ctx.fillRect(l.x,y,tw,l.rh);
    ctx.fillStyle=LINE; ctx.fillRect(l.x,y+l.rh-1,tw,1.5); if(!r) ctx.fillRect(l.x,y,tw,1.5); xs.forEach(x=>ctx.fillRect(x-.75,y,1.5,l.rh));
    if(!r){ ctx.fillStyle=mixRGB(INK,INK,0); ctx.font=`bold ${l.fs}px ${FONT}`; ['Ship','Length (m)','Bar'].forEach((h,c)=>ctx.fillText(h,xs[c]+14,y+l.rh/2+1)); }
  }
  ctx.globalAlpha=1;
}
function drawNames(t){
  const g=L.grid, l=L.list, xs=listCols(), tw=xs[3]-l.x, na = 1-ease(prog(t,T.focus,.6));
  ctx.textBaseline='middle';
  ctx.globalAlpha=1;
  if(na<=0) return;
  ctx.fillStyle=mixRGB(INK,INK,0);
  SL.forEach(sh=>{
    const ia = st(t,'list',sh.i+1,.025,.4); if(ia<=0) return;
    const p = st(t,'grid',sh.i,.02,1.2), [cx,cy]=cell(sh.i), ry=listY(sh.i+1)+l.rh/2+1+(1-ia)*10, fs=lerp(l.fs,g.fs,p);
    const ny = cy+g.ch*.4, ly = ny+g.fs*1.25;
    ctx.globalAlpha=ia*na; ctx.font=`${fs}px ${FONT}`; ctx.fillStyle=mixRGB(INK,INK,0);
    ctx.fillText(sh.name, lerp(xs[0]+14, cx-NAMES[sh.i]/2, p), lerp(ry, ny, p));
    const s = sh.len ? (p>.5 ? sh.len+' m' : String(sh.len)) : (p>.5 ? 'no data' : '');
    ctx.font=`${p>.5?'bold ':''}${fs}px ${FONT}`; const sw=ctx.measureText(s).width;
    ctx.fillStyle = sh.len ? mixRGB(INK,AMBER,p) : 'rgba(31,35,40,.4)';
    ctx.fillText(s, lerp(xs[1]+14, cx-sw/2, p), lerp(ry, ly, p));
  });
  ctx.globalAlpha=1;
}

// ---------- links: thin arrows, then the volume bars set their thickness ----------
const FL = [ // the two Avital transfers, with their path in published-image coordinates
  {to:'Snow Lotus', p:[[2560,258],[2620,252],[2672,236],[2710,212]]},
  {to:'MM Strength', p:[[2562,260],[2652,258],[2718,336],[2808,376]]},
];
FL.forEach(l=>{ l.row = LINKS.findIndex(r=>/Avital/.test(r[1]) && r[2].includes(l.to)); l.v = LINKS[l.row][0]; });
const PR = (()=>{ const n=Math.min(L.panel.rows, LINKS.length), hi=Math.max(...FL.map(l=>l.row)); const s=Math.max(0,Math.min(hi-n+4, LINKS.length-n)); return [s, s+n]; })();
const M = 80, thin = 3, thickOf = v=>v/MAXV*MAXT;
const bez = (p,u)=>{ const a=1-u; return [0,1].map(k=>a*a*a*p[0][k]+3*a*a*u*p[1][k]+3*a*u*u*p[2][k]+u*u*u*p[3][k]); };
function ribbon(center, th){
  const top=[], bot=[], n=center.length;
  center.forEach((p,k)=>{ const a=center[Math.max(0,k-1)], b=center[Math.min(n-1,k+1)], l=Math.hypot(b[0]-a[0],b[1]-a[1])||1, nx=-(b[1]-a[1])/l, ny=(b[0]-a[0])/l;
    top.push([p[0]-nx*th/2,p[1]-ny*th/2]); bot.push([p[0]+nx*th/2,p[1]+ny*th/2]); });
  ctx.beginPath(); top.forEach(([x,y],k)=>k?ctx.lineTo(x,y):ctx.moveTo(x,y)); for(let k=n-1;k>=0;k--) ctx.lineTo(bot[k][0],bot[k][1]); ctx.closePath();
}
const panelCols = ()=>L.panel.w.reduce((a,w)=>(a.push(a[a.length-1]+w),a),[L.panel.x]);
const rowY = r=>L.panel.y+(r-PR[0]+1)*L.panel.rh;
const barRect = (r,g)=>{ const xs=panelCols(), w=Math.max(1.5,thickOf(LINKS[r][0])*g); return [xs[2]+14, rowY(r)+4, w, L.panel.rh-8]; };
function drawPanel(t){
  const pa = 1-ease(prog(t,T.pout,.6)); if(t<T.data || pa<=0) return;
  const P=L.panel, xs=panelCols(), tw=xs[3]-P.x, g=ease(prog(t,T.bars,.8));
  ctx.textBaseline='middle';
  for(let r=PR[0]-1;r<PR[1];r++){
    const k=r-PR[0]+1, a=st(t,'data',k,.025,.4)*pa; if(a<=0) continue;
    const y=P.y+k*P.rh+(1-a/pa)*10; ctx.globalAlpha=a;
    ctx.fillStyle=k===0?'#f6f8fa':(k%2?'#fff':'#f9fafb'); ctx.fillRect(P.x,y,tw,P.rh);
    ctx.fillStyle=LINE; ctx.fillRect(P.x,y+P.rh-1,tw,1.5); if(!k) ctx.fillRect(P.x,y,tw,1.5);
    ctx.fillStyle=mixRGB(INK,INK,0); ctx.font=`${k?'':'bold '}${P.fs}px ${FONT}`;
    if(!k){ ctx.fillText('Cargo barrels',xs[0]+14,y+P.rh/2+1); ctx.fillText('Transfer',xs[1]+14,y+P.rh/2+1); ctx.fillText('Bar',xs[2]+14,y+P.rh/2+1); continue; }
    const [v,f,to]=LINKS[r]; ctx.fillText(fmt(v),xs[0]+14,y+P.rh/2+1);
    ctx.globalAlpha=a*.7; ctx.fillText(fit(f+' → '+to, P.w[1]-28),xs[1]+14,y+P.rh/2+1);
    if(g>0){ const [bx,by,bw,bh]=barRect(r,g); ctx.globalAlpha=a; ctx.fillStyle=mixRGB(AMBER,AMBER,0); ctx.fillRect(bx,by+(y-rowY(r)),bw,bh); }
  }
  // the two Avital rows
  const h = ease(prog(t,T.hl,.5))*pa;
  if(h>0) FL.forEach(l=>{ const y=rowY(l.row); ctx.globalAlpha=1; ctx.strokeStyle=`rgba(${ACCENT},${h})`; ctx.lineWidth=3; ctx.strokeRect(P.x,y,tw,P.rh);
    ctx.fillStyle=`rgba(${ACCENT},${.16*h})`; ctx.fillRect(P.x,y,tw,P.rh); });
  ctx.globalAlpha=1;
}
function drawLinks(t){
  if(t<T.lines+.01) return;
  const z=L.focus.z;
  FL.forEach((l,j)=>{
    const d = ease(prog(t, T.lines+j*.3, 1.0)), fly = ease(prog(t, T.fly+j*.3, 1.0)), grow = ease(prog(t, T.fly+.6+j*.3, .6));
    const th = lerp(thin, thickOf(l.v)*z, grow), n = Math.max(2, Math.round(M*d));
    const pts = [...Array(n).keys()].map(k=>toScreen(bez(l.p, k/(n-1)*d), FOC_CAM));
    const g = ctx.createLinearGradient(...toScreen(l.p[0],FOC_CAM), ...toScreen(l.p[3],FOC_CAM));
    g.addColorStop(0, mixRGB(AMBER,AMBER,0,.3)); g.addColorStop(1, mixRGB(AMBER,AMBER,0,1));
    ctx.fillStyle=g; ribbon(pts, th); ctx.fill();
    const aw = ease(prog(t, T.lines+.55+j*.3, .4));
    const m=toScreen(bez(l.p,.5),FOC_CAM), m2=toScreen(bez(l.p,.52),FOC_CAM), ang=Math.atan2(m2[1]-m[1],m2[0]-m[0]);
    if(aw>0){ const s=Math.max(9, th*1.05); ctx.globalAlpha=aw; ctx.fillStyle=mixRGB(AMBER,AMBER,0); ctx.save(); ctx.translate(m[0],m[1]); ctx.rotate(ang);
      ctx.beginPath(); ctx.moveTo(s,0); ctx.lineTo(-s*.8,-s*.7); ctx.lineTo(-s*.8,s*.7); ctx.closePath(); ctx.fill(); ctx.restore(); ctx.globalAlpha=1; }
    // the row's bar lifts out of the chart and lays itself across the line
    if(fly>0 && grow<1){ const [bx,by,bw,bh]=barRect(l.row,1), sx=bx+bw/2, sy=by+bh/2;
      ctx.save(); ctx.translate(lerp(sx,m[0],fly), lerp(sy,m[1],fly)); ctx.rotate(lerp(0, ang-Math.PI/2, fly));
      const w=bw*lerp(1,z,fly), hh=bh*lerp(1,1.6,fly); ctx.globalAlpha=1-grow; ctx.fillStyle=mixRGB(AMBER,AMBER,0); ctx.fillRect(-w/2,-hh/2,w,hh); ctx.restore(); ctx.globalAlpha=1; }
  });
}

// ---------- the published network, then a pan across it ----------
const FZ = (H-32)/958, HALF = (W/2-16)/FZ;
const FIN_CAM = [[T.real,...FOC_CAM],[T.out,...FOC_CAM],[T.out+1.8,HALF,479,FZ],[T.pan,HALF,479,FZ],[T.panEnd,3456-HALF,479,FZ]];
function camAt(keys,t){
  if(t<=keys[0][0]) return keys[0].slice(1);
  for(let i=0;i<keys.length-1;i++){ const [t0,x0,y0,z0]=keys[i],[t1,x1,y1,z1]=keys[i+1];
    if(t<=t1){ const p=ease((t-t0)/(t1-t0)); return [lerp(x0,x1,p),lerp(y0,y1,p),Math.exp(lerp(Math.log(z0),Math.log(z1),p))]; } }
  return keys[keys.length-1].slice(1);
}

function render(t){
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle=PAGE; ctx.fillRect(0,0,W,H);
  const dark = ease(prog(t,T.real,1.0));
  if(dark>0){ ctx.globalAlpha=dark; ctx.fillStyle=DARK; card(); ctx.fill(); ctx.globalAlpha=1; }
  drawChrome(t);
  drawShips(t);
  drawNames(t);
  drawPanel(t);
  drawLinks(t);
  const ra = ease(prog(t,T.real,1.0));
  if(ra>0){ const cam=camAt(FIN_CAM,t); ctx.save(); card(); ctx.clip(); ctx.globalAlpha=ra;
    ctx.setTransform(cam[2],0,0,cam[2],W/2-cam[0]*cam[2],H/2-cam[1]*cam[2]); ctx.drawImage(FINAL,0,0); ctx.restore(); ctx.globalAlpha=1; }
}

window.READY=false;
const stage = document.getElementById('stage'), ctrl = stage.querySelector('.controls'), bar = ctrl.querySelector('progress');
stage.style.setProperty('--ar', W/H); C.width = W; C.height = H;
let playing = false, ended = false, userPaused = false, now = 0, last = 0, hideT = 0;
const showControls=()=>{ stage.classList.add('show-controls'); clearTimeout(hideT); hideT=setTimeout(()=>stage.classList.remove('show-controls'),1500); };
const updateBar=()=>{ const p=Math.min(1,now/DUR); ctrl.style.setProperty('--progress',p.toFixed(4)); bar.value=p; };
function setState(s){ stage.dataset.state=s; stage.setAttribute('aria-label', s==='playing'?'Pause animation':s==='ended'?'Replay animation':'Play animation'); }
// Plays once and stops on the last frame; the control then shows a replay icon.
function tick(ts){
  if(!playing) return;
  now=Math.min(DUR, now+Math.max(0,ts-last)/1000); last=ts; render(now); updateBar();
  if(now>=DUR){ playing=false; ended=true; setState('ended'); return; }
  requestAnimationFrame(tick);
}
function setPlaying(p){
  if(p===playing) return;
  if(p && ended){ ended=false; now=0; }
  playing=p; setState(p?'playing':'paused');
  if(p){ last=performance.now(); requestAnimationFrame(tick); }
}
function seek(t){ now=Math.max(0,Math.min(DUR,t)); if(ended && now<DUR){ ended=false; setState('paused'); } render(now); updateBar(); }
function toggle(){ if(ended){ userPaused=false; setPlaying(true); } else { userPaused=playing; setPlaying(!playing); } showControls(); }
// Tap or click toggles; dragging sideways across the animation scrubs, like the site's video player.
let downT=0, downX=0, downY=0, scrubbing=false, resume=false;
stage.addEventListener('pointerdown', e=>{ downT=performance.now(); downX=e.clientX; downY=e.clientY; scrubbing=false; showControls(); });
stage.addEventListener('pointermove', e=>{
  showControls();
  if(!downT) return;
  const dx=e.clientX-downX, dy=e.clientY-downY;
  if(!scrubbing && Math.abs(dx)>6 && Math.abs(dx)>Math.abs(dy)){ scrubbing=true; resume=playing; setPlaying(false); stage.setPointerCapture(e.pointerId); }
  if(scrubbing){ const r=stage.getBoundingClientRect(); seek(DUR*(e.clientX-r.left)/r.width); }
});
stage.addEventListener('pointerup', ()=>{
  const tap=!scrubbing && performance.now()-downT<300; downT=0;
  if(scrubbing){ scrubbing=false; if(resume) setPlaying(true); else userPaused=true; return; }
  if(tap) toggle();
});
stage.addEventListener('pointercancel', ()=>{ downT=0; scrubbing=false; });
stage.addEventListener('click', e=>{ if(e.detail===0) toggle(); });
stage.addEventListener('keydown', e=>{ if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ e.preventDefault(); seek(now+(e.key==='ArrowRight'?5:-5)); showControls(); } });
Promise.all([TANK.decode(), FINAL.decode()]).catch(()=>{}).then(()=>document.fonts.ready).then(()=>{
  prepareText();
  window.READY = true;
  if(location.hash.includes('static')) return render(0);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ seek(DUR); ended=true; setState('ended'); return; }
  render(0); updateBar();
  // Play only while at least half the animation is on screen; this also works inside an iframe embed.
  new IntersectionObserver(([e])=>{ if(!userPaused && !ended) setPlaying(e.isIntersecting); }, {threshold:.5}).observe(stage);
});
</script>
</body></html>
