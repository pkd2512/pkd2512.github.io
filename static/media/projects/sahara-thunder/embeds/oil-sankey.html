<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600&display=block" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body{margin:0;min-height:100%;background:#fafafa}
body{display:grid;place-items:center;min-height:100vh;min-height:100dvh}
figure{margin:0}
.stage{--ar:1;position:relative;display:block;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:pan-y;
  aspect-ratio:var(--ar);width:min(100vw,calc((100vh - 14px)*var(--ar)));width:min(100vw,calc((100dvh - 14px)*var(--ar)));margin-bottom:14px}
.stage canvas{display:block;width:100%;height:100%}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.controls{position:absolute;left:0;right:0;top:calc(100% - 12px);height:24px;display:flex;align-items:center;pointer-events:none;opacity:0;transition:opacity 1s}
.stage.show-controls .controls,.stage[data-state=ended] .controls,.stage:focus-visible .controls{opacity:1;transition-duration:.2s}
.controls progress{display:block;width:100%;height:3px;border:0;-webkit-appearance:none;appearance:none;background:#eeeeee}
.controls progress::-webkit-progress-bar{background:#eeeeee}
.controls progress::-webkit-progress-value{background:#41295a}
.controls progress::-moz-progress-bar{background:#41295a}
.controls .ico{position:absolute;left:clamp(0px,calc(var(--progress,0)*100% - 12px),calc(100% - 24px));width:24px;height:24px;border-radius:24px;background:#fafafa;color:#2f0743;display:grid}
.controls .ico svg{grid-area:1/1;width:24px;height:24px;display:none}
.stage[data-state=paused] .i-play,.stage[data-state=playing] .i-pause,.stage[data-state=ended] .i-replay{display:block}
@media (prefers-reduced-motion: reduce){.controls{transition:none}}
</style>
</head><body>
<figure>
  <button class="stage" id="stage" type="button" aria-label="Play animation" aria-describedby="desc" data-state="paused">
    <canvas id="c" width="1080" height="1440" aria-hidden="true"></canvas>
    <span class="controls" aria-hidden="true"><progress max="1" value="0"></progress><span class="ico"><svg class="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M12 20c-4.41 0-8-3.59-8-8s3.59-8 8-8s8 3.59 8 8s-3.59 8-8 8m0-18A10 10 0 0 0 2 12a10 10 0 0 0 10 10a10 10 0 0 0 10-10A10 10 0 0 0 12 2m-2 14.5l6-4.5l-6-4.5z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><path fill="currentColor" d="M22 12c0-5.54-4.46-10-10-10c-1.17 0-2.3.19-3.38.56l.7 1.94c.85-.34 1.74-.53 2.68-.53c4.41 0 8.03 3.62 8.03 8.03s-3.62 8.03-8.03 8.03S3.97 16.41 3.97 12c0-.94.19-1.88.53-2.72l-1.94-.66C2.19 9.7 2 10.83 2 12c0 5.54 4.46 10 10 10s10-4.46 10-10M5.47 7c-.79 0-1.5-.68-1.5-1.53c0-.79.71-1.5 1.5-1.5c.85 0 1.53.71 1.53 1.5C7 6.32 6.32 7 5.47 7M9 9h2v6H9m4-6h2v6h-2"/></svg><svg class="i-replay" viewBox="0 0 24 24"><path fill="currentColor" d="M12 5V1L7 6l5 5V7a6 6 0 0 1 6 6a6 6 0 0 1-6 6a6 6 0 0 1-6-6H4a8 8 0 0 0 8 8a8 8 0 0 0 8-8a8 8 0 0 0-8-8"/></svg></span></span>
  </button>
  <figcaption id="desc" class="sr-only">Animation: a table of 22 oil tanker cargoes turns into a raw sankey chart of origin, journey and destination, then into the final chart showing 16.3 million barrels of Iranian oil, most of it bound for China.</figcaption>
</figure>
<script>
const W = 1080, H = 1440, CX = 540, CY = 720, FPS = 60, DUR = 14.5, FRAMES = Math.round(DUR * FPS);
const C = document.getElementById('c'), ctx = C.getContext('2d');

// Journey 11 destination follows the raw + final charts (Unknown); the table screenshot says Iran.
const rows = [
  [1,'Iran','Iran',274127],[2,'Iran','Unknown',57733],[2,'Iran','Iran',212288],[3,'Iran','China',699593],
  [4,'Venezuela','China',1900000],[5,'Iran','Iran',266934],[6,'Iran','Iran',270251],[7,'Iran','China',1977640],
  [8,'Iran','Unknown',1987000],[9,'Iran','Iran',271475],[10,'Iran','China',2044000],[11,'Iran','Unknown',1764506],
  [12,'Iran','Unknown',439143],[12,'Iran','Iran',1462135],[12,'Iran','United Arab Emirates',201093],
  [13,'Iran','United Arab Emirates',68000],[14,'Iran','China',1007281],[15,'Other','China',700000],
  [15,'Iran','China',211024],[16,'Iran','China',1100000],[17,'Russia','China',1050000],[18,'Iran','China',2000000]
].map(([j,o,d,v],i)=>({i,j,o,d,v}));
const ORIG = ['Iran','Venezuela','Other','Russia'];
const DEST = ['Iran','Unknown','China','United Arab Emirates'];
const JOURNEYS = [...Array(18)].map((_,k)=>k+1);
const TOTAL = rows.reduce((s,r)=>s+r.v,0);
const sumBy = (key,val)=>rows.filter(r=>r[key]===val).reduce((s,r)=>s+r.v,0);

const hex = h=>[1,3,5].map(k=>parseInt(h.slice(k,k+2),16));
const rgb = (c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const lerp = (a,b,p)=>a+(b-a)*p;
const lerpC = (a,b,p)=>a.map((x,k)=>lerp(x,b[k],p));
const clamp = x=>Math.max(0,Math.min(1,x));
const ease = p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const smooth = u=>u*u*(3-2*u);
const prog = (t,s,d)=>clamp((t-s)/d);

const ORIG_C = {Iran:hex('#5f9fb0'),Venezuela:hex('#5a4e9e'),Other:hex('#4f80b3'),Russia:hex('#5068aa')};
const J_C = ['#8e1a45','#f5f0a6','#f3f5b0','#eef7b0','#d4ecb0','#c6e6b0','#a9d6a5','#8fc8a8','#6db3a8','#a82a48',
  '#bf4550','#d45a50','#e27050','#e8895a','#eea468','#f2bc78','#f5d08a','#f8e6a0'].map(hex);
const GOLD = hex('#c4a24c'), DARKFLOW = hex('#353d3d');
const DEST_MID = {Iran:hex('#d6b352'),Unknown:hex('#454c4c'),China:hex('#c9cac7'),'United Arab Emirates':hex('#d6b352')};
const DEST_END = {Iran:hex('#ecc55a'),Unknown:hex('#2c3333'),China:hex('#ffffff'),'United Arab Emirates':hex('#ecc55a')};
const PAGE = hex('#fafafa'), DARK = hex('#151c1b');
const M = 120;
// Offset a centerline along its normal so ribbons keep the same width through bends (no tapering).
function thick(center, t, cross){
  const top=[], bot=[], n=center.length;
  center.forEach((p,k)=>{
    const a=center[Math.max(0,k-1)], b=center[Math.min(n-1,k+1)], L=Math.hypot(b[0]-a[0],b[1]-a[1])||1;
    let nx=-(b[1]-a[1])/L, ny=(b[0]-a[0])/L;
    if(nx*cross[0]+ny*cross[1]<0){nx=-nx; ny=-ny;}
    top.push([p[0]-nx*t/2,p[1]-ny*t/2]); bot.push([p[0]+nx*t/2,p[1]+ny*t/2]);
  });
  return {top,bot};
}

// ---------- table ----------
const TX = 110, TW = 860, RH = 48, TY = (H-23*RH)/2, COLS = [110,260,460,760,970];
const kb = TW/2044000;
function barState(r, g){
  const y = TY + (r.i+1)*RH + 8, h = RH-16, w = Math.max(r.v*kb*g, 0.001);
  const top=[],bot=[];
  for(let k=0;k<M;k++){const x=TX+w*k/(M-1); top.push([x,y]); bot.push([x,y+h]);}
  const c = ORIG_C[r.o];
  return {top,bot,p0:[TX,CY],p1:[TX+TW,CY],stops:[[0,c],[.5,c],[.5,c],[1,c]],a:1};
}

// ---------- raw sankey (horizontal) ----------
const NW = 12, PAD = 4, RT = 370, RB = 1070, XO = 46, XJ = 534, XD = 1022;
const kr = ((RB-RT) - 17*PAD)/TOTAL;
function stack(names, key, x){
  const h = TOTAL*kr + (names.length-1)*PAD; let y = RT + ((RB-RT)-h)/2; const out={};
  for(const n of names){const v=sumBy(key,n); out[n]={x,y,h:v*kr,v}; y+=v*kr+PAD;}
  return out;
}
const rawO = stack(ORIG,'o',XO), rawJ = stack(JOURNEYS,'j',XJ), rawD = stack(DEST,'d',XD);
const offs = (groupKey, names, sortFn, nodes)=>{
  const res={};
  for(const n of names){let y=nodes[n].y; rows.filter(r=>r[groupKey]===n).sort(sortFn).forEach(r=>{res[r.i]=y; y+=r.v*kr;});}
  return res;
};
const byJ=(a,b)=>a.j-b.j||DEST.indexOf(a.d)-DEST.indexOf(b.d);
const oOut = offs('o',ORIG,byJ,rawO);
const jIn = offs('j',JOURNEYS,(a,b)=>ORIG.indexOf(a.o)-ORIG.indexOf(b.o),rawJ);
const jOut = offs('j',JOURNEYS,(a,b)=>DEST.indexOf(a.d)-DEST.indexOf(b.d),rawJ);
const dIn = offs('d',DEST,(a,b)=>a.j-b.j||ORIG.indexOf(a.o)-ORIG.indexOf(b.o),rawD);
function rawState(r){
  const t=r.v*kr, half=M/2, s1=[], s2=[];
  for(let k=0;k<half;k++){const u=k/(half-1);
    s1.push([lerp(XO+NW,XJ,u), lerp(oOut[r.i],jIn[r.i],smooth(u))+t/2]);
    s2.push([lerp(XJ+NW,XD,u), lerp(jOut[r.i],dIn[r.i],smooth(u))+t/2]);}
  const e1=thick(s1,t,[0,1]), e2=thick(s2,t,[0,1]), top=[...e1.top,...e2.top], bot=[...e1.bot,...e2.bot];
  const a=(XJ+NW/2-(XO+NW))/(XD-(XO+NW)), co=ORIG_C[r.o], cj=J_C[r.j-1];
  return {top,bot,p0:[XO+NW,CY],p1:[XD,CY],stops:[[0,co],[a,co],[a,cj],[1,cj]],a:.86};
}
// Final chart: origin -> hidden journey layer -> destination, every layer packed with no gaps.
const FORIG = ['Iran','Venezuela','Russia','Other'];
const topC = r=>r.o==='Other'?DARKFLOW:GOLD;
const finColors = r=>[[0,topC(r)],[.34,topC(r)],[.5,DEST_MID[r.d]],[1,DEST_END[r.d]]];
function packed(start,k){
  const pos={o:{},j:{},d:{}}, put=(layer,list)=>{let p=start; list.forEach(r=>{pos[layer][r.i]=p; p+=r.v*k;});};
  put('o',FORIG.flatMap(n=>rows.filter(r=>r.o===n).sort(byJ)));
  put('j',[...rows].sort((a,b)=>a.j-b.j||DEST.indexOf(a.d)-DEST.indexOf(b.d)||FORIG.indexOf(a.o)-FORIG.indexOf(b.o)));
  put('d',DEST.flatMap(n=>rows.filter(r=>r.d===n).sort((a,b)=>a.j-b.j||FORIG.indexOf(a.o)-FORIG.indexOf(b.o))));
  return pos;
}
// Monotone cubic through origin -> journey -> destination, so flows bend smoothly through the hidden middle layer.
const herm=(a,b,sa,sb,h,u)=>{const u2=u*u,u3=u2*u; return (2*u3-3*u2+1)*a+(u3-2*u2+u)*h*sa+(3*u2-2*u3)*b+(u3-u2)*h*sb;};
function curve(c0,c1,c2,m0,m1,m2){
  const d1=(c1-c0)/(m1-m0), d2=(c2-c1)/(m2-m1), s=d1*d2>0?2/(1/d1+1/d2):0, half=M/2, out=[];
  for(let k=0;k<M;k++){
    if(k<half){const u=k/(half-1); out.push([lerp(m0,m1,u),herm(c0,c1,0,s,m1-m0,u)]);}
    else{const u=(k-half)/(half-1); out.push([lerp(m1,m2,u),herm(c1,c2,s,0,m2-m1,u)]);}
  }
  return out;
}
function directState(r){
  const t=r.v*kf, pts=curve(dP.o[r.i]+t/2,dP.j[r.i]+t/2,dP.d[r.i]+t/2,XO+NW,(XO+NW+XD)/2,XD);
  return {...thick(pts,t,[0,1]),p0:[XO+NW,CY],p1:[XD,CY],stops:finColors(r),a:.9};
}

// ---------- final (vertical): the published chart's exact geometry, so the flip lands on it ----------
const IH = H-32, IS = IH/1436, IW = 984*IS, IX = (W-IW)/2, IY = 16;
const FL = IX+60*IS, FR = IX+810*IS, YT = IY+100*IS, YM = IY+705*IS, YB = IY+1340*IS;
const kf = (FR-FL)/TOTAL, fP = packed(FL,kf), dP = packed(CY-(FR-FL)/2,kf);
function finalState(r){
  const w=r.v*kf, pts=curve(fP.o[r.i]+w/2,fP.j[r.i]+w/2,fP.d[r.i]+w/2,r.o==='Other'?IY+150*IS:YT,YM,YB).map(([y,x])=>[x,y]);
  return {...thick(pts,w,[1,0]),p0:[CX,YT],p1:[CX,YB],stops:finColors(r),a:.88};
}
const tp = ([x,y])=>[CX+(y-CY), CY+(x-CX)];
const transpose = s=>({...s, top:s.top.map(tp), bot:s.bot.map(tp), p0:tp(s.p0), p1:tp(s.p1)});
// 3D flip about the top-left/bottom-right diagonal; at th=PI it equals a transpose.
function flipPt([x,y],th){
  const u=((x-CX)+(y-CY))/Math.SQRT2, v=((x-CX)-(y-CY))/Math.SQRT2, vx=v*Math.cos(th), s=3200/(3200+v*Math.sin(th));
  return [CX+s*(u+vx)/Math.SQRT2, CY+s*(u-vx)/Math.SQRT2];
}
const flip = (s,th)=>({...s, top:s.top.map(p=>flipPt(p,th)), bot:s.bot.map(p=>flipPt(p,th)), p0:flipPt(s.p0,th), p1:flipPt(s.p1,th)});
// Draw Venezuela last so its sweep to China sits above the other flows, as in the published chart.
const ORDER = [...rows].sort((a,b)=>(a.o==='Venezuela')-(b.o==='Venezuela'));

const BAR = rows.map(r=>barState(r,1)), RAW = rows.map(rawState), DIR = rows.map(directState), TFIN = rows.map(r=>transpose(finalState(r)));
const mix=(A,B,p)=>({
  top:A.top.map((pt,k)=>[lerp(pt[0],B.top[k][0],p),lerp(pt[1],B.top[k][1],p)]),
  bot:A.bot.map((pt,k)=>[lerp(pt[0],B.bot[k][0],p),lerp(pt[1],B.bot[k][1],p)]),
  p0:[lerp(A.p0[0],B.p0[0],p),lerp(A.p0[1],B.p0[1],p)], p1:[lerp(A.p1[0],B.p1[0],p),lerp(A.p1[1],B.p1[1],p)],
  stops:A.stops.map((s,k)=>[lerp(s[0],B.stops[k][0],p),lerpC(s[1],B.stops[k][1],p)]), a:lerp(A.a,B.a,p)
});
function drawRibbon(s,alpha){
  if(alpha<=0) return;
  const g=ctx.createLinearGradient(s.p0[0],s.p0[1],s.p1[0],s.p1[1]);
  s.stops.forEach(([o,c])=>g.addColorStop(clamp(o),rgb(c)));
  ctx.globalAlpha=s.a*alpha; ctx.fillStyle=g; ctx.beginPath();
  s.top.forEach(([x,y],k)=>k?ctx.lineTo(x,y):ctx.moveTo(x,y));
  for(let k=s.bot.length-1;k>=0;k--) ctx.lineTo(s.bot[k][0],s.bot[k][1]);
  ctx.closePath(); ctx.fill(); ctx.globalAlpha=1;
}
function text(str,x,y,{font,color='#1f2328',align='left',alpha=1,halo=null}){
  if(alpha<=0) return;
  ctx.globalAlpha=alpha; ctx.font=font; ctx.textAlign=align; ctx.textBaseline='middle';
  if(halo){ctx.lineJoin='round'; ctx.lineWidth=4; ctx.strokeStyle=halo; ctx.strokeText(str,x,y);}
  ctx.fillStyle=color; ctx.fillText(str,x,y); ctx.globalAlpha=1;
}

// ---------- timeline ----------
const T = {rowsIn:0, barsIn:1.7, textOut:2.3, toRaw:3.0, rawLabels:4.5, toDirect:7.0, flip:8.9, real:10.2};

    const y=TY+(r+1)*RH + (1-a/alpha)*14;
    ctx.globalAlpha=a; ctx.fillStyle=(r%2===0)?'#f6f8fa':'#ffffff'; ctx.fillRect(TX,y,TW,RH);
    ctx.strokeStyle='#d8dee4'; ctx.lineWidth=1; ctx.strokeRect(TX+.5,y+.5,TW-1,RH-1);
    COLS.slice(1,-1).forEach(cx=>{ctx.beginPath();ctx.moveTo(cx+.5,y);ctx.lineTo(cx+.5,y+RH);ctx.stroke();});
    ctx.globalAlpha=1;
    const cells = r<0?hdr:[rows[r].j,rows[r].o,rows[r].d,rows[r].v];
    cells.forEach((c,k)=>text(String(c),COLS[k]+18,y+RH/2+2,{font:`${r<0?600:400} 22px Hind`,alpha:a}));
  }
}
function drawRawChrome(a){
  if(a<=0) return;
  ctx.globalAlpha=a; ctx.fillStyle='#000';
  for(const nodes of [rawO,rawJ,rawD]) for(const n in nodes){const d=nodes[n]; ctx.fillRect(d.x,d.y,NW,d.h);}
  ctx.globalAlpha=1;
  const f='600 15px Helvetica, Arial, sans-serif', h='rgba(255,255,255,.9)';
  text('Oil origin',XO,RT-28,{font:'bold 18px Helvetica, Arial',color:'#8a8a8a',alpha:a});
  text('Journey',XJ+NW/2,RT-28,{font:'bold 18px Helvetica, Arial',color:'#8a8a8a',align:'center',alpha:a});
  text('Oil Destination',XD+NW,RT-28,{font:'bold 18px Helvetica, Arial',color:'#8a8a8a',align:'right',alpha:a});
  for(const n of ORIG) text(n,XO+NW+6,rawO[n].y+rawO[n].h/2,{font:f,halo:h,alpha:a});
  for(const n of JOURNEYS) text(String(n),XJ+NW+5,rawJ[n].y+rawJ[n].h/2,{font:'600 13px Helvetica, Arial, sans-serif',halo:h,alpha:a});
  for(const n of DEST) text(n,XD-6,rawD[n].y+Math.max(rawD[n].h/2,6),{font:f,halo:h,align:'right',alpha:a});
}

function render(t){
  const toFin=ease(prog(t,T.toDirect,1.2));
  ctx.fillStyle=rgb(PAGE); ctx.fillRect(0,0,W,H);
  const fp=ease(prog(t,T.flip,1.4));
  const panel=()=>{ctx.beginPath(); ctx.roundRect(16,lerp(RT-70,16,fp),W-32,lerp(RB-RT+110,H-32,fp),24);};
  if(toFin>0){ctx.globalAlpha=toFin; ctx.fillStyle=rgb(DARK); panel(); ctx.fill(); ctx.globalAlpha=1;}
  drawTable(t,1-ease(prog(t,T.textOut,.7)));
  ORDER.forEach(r=>{
    const k=r.i; let s, a=1;
    if(t<T.toRaw){const g=ease(prog(t,T.barsIn+k*.025,.6)); s=barState(r,g); a*=clamp(g*4)*lerp(.9,.85,prog(t,T.textOut,.7));}
    else if(t<T.toDirect) s=mix(BAR[k],RAW[k],ease(prog(t,T.toRaw+k*.03,1.4)));
    else if(t<T.flip) s=mix(RAW[k],DIR[k],ease(prog(t,T.toDirect+.15+k*.025,1.1)));
    else s=flip(mix(DIR[k],TFIN[k],fp),Math.PI*fp);
    drawRibbon(s,a);
  });
  drawRawChrome(ease(prog(t,T.rawLabels,.8))*(1-ease(prog(t,T.toDirect,.4))));
  const fin=ease(prog(t,T.flip+1.0,.6));
  if(fin>0){
    const g=ctx.createLinearGradient(0,YT,0,YT+300);
    g.addColorStop(0,rgb(DARK,fin)); g.addColorStop(.35,rgb(DARK,.6*fin)); g.addColorStop(1,rgb(DARK,0));
    ctx.save(); panel(); ctx.clip(); ctx.fillStyle=g; ctx.fillRect(0,0,W,YT+300); ctx.restore();
  }
  const ra=ease(prog(t,T.real,1));
  if(ra>0 && REAL.naturalWidth){ctx.save(); panel(); ctx.clip(); ctx.globalAlpha=ra; ctx.drawImage(REAL,IX,IY,IW,IH); ctx.restore();}
}

window.READY=false;
const stage = document.getElementById('stage'), ctrl = stage.querySelector('.controls'), bar = ctrl.querySelector('progress');
stage.style.setProperty('--ar', W/H); C.width = W; C.height = H;
let playing = false, ended = false, userPaused = false, now = 0, last = 0, hideT = 0;
const showControls=()=>{ stage.classList.add('show-controls'); clearTimeout(hideT); hideT=setTimeout(()=>stage.classList.remove('show-controls'),1500); };
const updateBar=()=>{ const p=Math.min(1,now/DUR); ctrl.style.setProperty('--progress',p.toFixed(4)); bar.value=p; };
function setState(s){ stage.dataset.state=s; stage.setAttribute('aria-label', s==='playing'?'Pause animation':s==='ended'?'Replay animation':'Play animation'); }
// Plays once and stops on the last frame; the control then shows a replay icon.
function tick(ts){
  if(!playing) return;
  now=Math.min(DUR, now+Math.max(0,ts-last)/1000); last=ts; render(now); updateBar();
  if(now>=DUR){ playing=false; ended=true; setState('ended'); return; }
  requestAnimationFrame(tick);
}
function setPlaying(p){
  if(p===playing) return;
  if(p && ended){ ended=false; now=0; }
  playing=p; setState(p?'playing':'paused');
  if(p){ last=performance.now(); requestAnimationFrame(tick); }
}
function seek(t){ now=Math.max(0,Math.min(DUR,t)); if(ended && now<DUR){ ended=false; setState('paused'); } render(now); updateBar(); }
function toggle(){ if(ended){ userPaused=false; setPlaying(true); } else { userPaused=playing; setPlaying(!playing); } showControls(); }
// Tap or click toggles; dragging sideways across the animation scrubs, like the site's video player.
let downT=0, downX=0, downY=0, scrubbing=false, resume=false;
stage.addEventListener('pointerdown', e=>{ downT=performance.now(); downX=e.clientX; downY=e.clientY; scrubbing=false; showControls(); });
stage.addEventListener('pointermove', e=>{
  showControls();
  if(!downT) return;
  const dx=e.clientX-downX, dy=e.clientY-downY;
  if(!scrubbing && Math.abs(dx)>6 && Math.abs(dx)>Math.abs(dy)){ scrubbing=true; resume=playing; setPlaying(false); stage.setPointerCapture(e.pointerId); }
  if(scrubbing){ const r=stage.getBoundingClientRect(); seek(DUR*(e.clientX-r.left)/r.width); }
});
stage.addEventListener('pointerup', ()=>{
  const tap=!scrubbing && performance.now()-downT<300; downT=0;
  if(scrubbing){ scrubbing=false; if(resume) setPlaying(true); else userPaused=true; return; }
  if(tap) toggle();
});
stage.addEventListener('pointercancel', ()=>{ downT=0; scrubbing=false; });
stage.addEventListener('click', e=>{ if(e.detail===0) toggle(); });
stage.addEventListener('keydown', e=>{ if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ e.preventDefault(); seek(now+(e.key==='ArrowRight'?5:-5)); showControls(); } });
Promise.all(['400 22px Hind','600 22px Hind'].map(f=>document.fonts.load(f)).concat(REAL.decode().catch(()=>{}))).then(()=>document.fonts.ready).then(()=>{
  
  window.READY = true;
  if(location.hash.includes('static')) return render(0);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ seek(DUR); ended=true; setState('ended'); return; }
  render(0); updateBar();
  // Play only while at least half the animation is on screen; this also works inside an iframe embed.
  new IntersectionObserver(([e])=>{ if(!userPaused && !ended) setPlaying(e.isIntersecting); }, {threshold:.5}).observe(stage);
});
</script>
