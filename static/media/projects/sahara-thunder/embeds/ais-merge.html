const lerp = (a,b,p)=>a+(b-a)*p, clamp = x=>Math.max(0,Math.min(1,x));

// ---------- layout ----------
const M = MOBILE ? 24 : 40;

  cardW: W-2*M, cardH: 334, cardGap: 16, cardY: 140, rows: 8, rh: 30, fs: 14,

};
const CARDS = [
  {k:'gps', title:'Leaked GPS dumps', sub:`5 ships · ${fmt(D.counts.gps)} daily positions`, head:['Ship','Date','Latitude','Longitude'], w:[.2,.36,.22,.22], rows:D.preview.gps},

];
const cardRect = i=>MOBILE ? [M, L.cardY+i*(L.cardH+L.cardGap), L.cardW, L.cardH] : [M+i*(L.cardW+L.cardGap), L.cardY, L.cardW, L.cardH];

function fitText(s, w){ if(ctx.measureText(s).width<=w) return s; while(s.length>1 && ctx.measureText(s+'…').width>w) s=s.slice(0,-1); return s+'…'; }
function card(i, a, t){
  if(a<=0) return; const c=CARDS[i], [x,y,w,h]=cardRect(i), lift=(1-a)*16;
  ctx.save(); ctx.globalAlpha=a; ctx.translate(0,lift);
  ctx.shadowColor='rgba(16,24,40,.08)'; ctx.shadowBlur=24; ctx.shadowOffsetY=6; ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.roundRect(x,y,w,h,18); ctx.fill(); ctx.shadowColor='transparent';
  ctx.fillStyle=SRC[c.k].c; ctx.beginPath(); ctx.roundRect(x+24,y+30,12,12,3); ctx.fill();
  ctx.fillStyle=INK; ctx.font=`bold ${MOBILE?20:22}px ${FONT}`; ctx.textBaseline='middle'; ctx.fillText(c.title, x+46, y+37);
  const tx=x+20, tw=w-40, ty=y+(MOBILE?66:72), cols=c.w.reduce((acc,f)=>(acc.push(acc[acc.length-1]+f*tw),acc),[tx]);
  [c.head, ...c.rows.slice(0,L.rows)].forEach((r,k)=>{
    const ra = ease(prog(t, T.cards+.3+i*.25+k*.05, .35)); if(ra<=0) return;
    const ry = ty+k*L.rh; ctx.globalAlpha=a*ra;
    ctx.fillStyle = k===0?'#f6f8fa':(k%2?'#fff':'#f9fafb'); ctx.fillRect(tx,ry,tw,L.rh);
    ctx.fillStyle=LINE; ctx.fillRect(tx,ry+L.rh-1,tw,1);
    ctx.fillStyle=k?INK:INK; ctx.font=`${k?'':'bold '}${L.fs}px ${FONT}`;
    r.forEach((v,j)=>ctx.fillText(fitText(String(v), cols[j+1]-cols[j]-14), cols[j]+10, ry+L.rh/2+1));
  });
  ctx.restore();
}

// ---------- coverage lanes ----------
const SHIPS = [...new Set(D.lanes.map(l=>l[0]))], KINDS=['gps','lseg','kpler'];

function laneY(ship, kind, focus){        // y of a lane in the overview, or in a focused layout listing only some ships

function domainAt(t){                       // the timeline's visible day range
  const full=[0,D.span], w14=[D.j14.from-6, D.j14.to+6];
  const z14=ease(prog(t,T.j14,1.2)), zo=ease(prog(t,T.mix,1.0));
  const d = [lerp(full[0],w14[0],z14), lerp(full[1],w14[1],z14)];
  return [lerp(d[0],full[0],zo), lerp(d[1],full[1],zo)];
}
function lanesBottom(t){ const [fa,fb,fp]=focusAt(t), n=f=>(f==='all'?SHIPS:FOCUS[f]).length, b=f=>L.tlY+46+n(f)*(3*L.laneH+L.shipGap)-L.shipGap; return lerp(b(fa),b(fb),fp); }
const focusAt = t=> ['all','j14',ease(prog(t,T.j14,1.0))*(1-ease(prog(t,T.mix,1.0)))];
function drawTimeline(t, a){
  if(a<=0) return;
  const [d0,d1]=domainAt(t), X=d=>L.tlX+(d-d0)/(d1-d0)*L.tlW, sweep=ease(prog(t,T.sweep,2.6));
  ctx.save(); ctx.globalAlpha=a; ctx.beginPath(); ctx.rect(L.tlX-2, 0, L.tlW+4, H); ctx.clip();
  // year / month axis
  ctx.textBaseline='middle'; ctx.font=`${MOBILE?12:15}px ${FONT}`;
  for(let y=2022;y<=2024;y++) for(let m=0;m<12;m++){
    const dd=(Date.UTC(y,m,1)-Date.UTC(2022,0,1))/864e5; if(dd>D.span) break; const x=X(dd); if(x<L.tlX-40||x>L.tlX+L.tlW+40) continue;
    const major = m===0, px=(d1-d0)/L.tlW;
    if(!major && 30/px<44) continue;
    ctx.fillStyle=major?'#c9d1d9':'#e6e9ee'; ctx.fillRect(x, L.tlY+28, 1, lanesBottom(t)-L.tlY-20);
    ctx.fillStyle=major?INK:MUTED; const lab=major?String(y):new Date(Date.UTC(y,m,1)).toLocaleString('en-US',{month:'short',timeZone:'UTC'});
    ctx.fillText(lab, x+5, L.tlY+14);
  }
  ctx.restore(); ctx.save(); ctx.globalAlpha=a;
  // lanes: one tick per day with a position
  const [fa,fb,fp]=focusAt(t), dayW=Math.max(1.4, L.tlW/(d1-d0)*.9);
  D.lanes.forEach(([ship,kind,days])=>{
    const ya=fa==='all'?laneY(ship,kind):laneY(ship,kind,fa), yb=laneY(ship,kind,fb);
    let la = ya==null&&yb==null ? 0 : ya==null ? fp : yb==null ? 1-fp : 1; if(la<=0) return;
    const y = lerp(ya??yb, yb??ya, fp);
    ctx.globalAlpha=a*la;
    if(kind==='gps' || ya!=null && fa==='all'){ /* labels below */ }
    ctx.fillStyle='#eef1f4'; ctx.fillRect(L.tlX, y+2, L.tlW, L.laneH-4);
    ctx.save(); ctx.beginPath(); ctx.rect(L.tlX, y, L.tlW*sweep, L.laneH); ctx.clip(); ctx.fillStyle=SRC[kind].c;
    for(const d of days){ if(d<d0-1||d>d1+1) continue; ctx.fillRect(X(d), y+2, dayW, L.laneH-4); }
    ctx.restore();
    if(kind==='gps'){ ctx.fillStyle=INK; ctx.font=`bold ${L.lfs}px ${FONT}`; ctx.textAlign='right'; ctx.fillText(ship, L.tlX-14, y+1.5*L.laneH); ctx.textAlign='left'; }
  });
  // event markers and journey windows
  // STS / port events sit just above each ship's lanes, and follow them into the zoomed view
  const ea=ease(prog(t,T.events,.8))*(1-ease(prog(t,T.mix,.6)));
  if(ea>0){ ctx.fillStyle=SRC.sts.c; const r=MOBILE?4:5;
    D.events.forEach(([d,ship])=>{
      const ya=fa==='all'?laneY(ship,'gps'):laneY(ship,'gps',fa), yb=laneY(ship,'gps',fb); if(ya==null&&yb==null) return;
      const la=ya==null?fp:yb==null?1-fp:1, x=X(d+.5), y=lerp(ya??yb, yb??ya, fp)-Math.min(8,L.shipGap/2);
      if(x<L.tlX-r||x>L.tlX+L.tlW+r) return;
      ctx.globalAlpha=a*ea*la; ctx.beginPath(); ctx.moveTo(x,y-r); ctx.lineTo(x+r,y); ctx.lineTo(x,y+r); ctx.lineTo(x-r,y); ctx.fill(); }); }
  const wa=ease(prog(t,T.windows,.7)), out=1-ease(prog(t,T.mix,.6));
  if(wa*out>0) D.windows.forEach(([j,ships],i)=>{
    const show = (t<T.j14 ? 1 : j==='14' ? 1 : 1-ease(prog(t,T.j14,.6))) * ease(prog(t,T.windows+i*.08,.5)); if(show<=0) return;
    ships.forEach(([ship,from,to])=>{
      const x0=X(from), x1=Math.max(X(to+1), x0+3);
      const ya=fa==='all'?laneY(ship,'gps'):laneY(ship,'gps',fa), yb=laneY(ship,'gps',fb); if(ya==null&&yb==null) return;
      const y=lerp(ya??yb, yb??ya, fp)-3, h=3*L.laneH+6, la=ya==null?fp:yb==null?1-fp:1;
      ctx.globalAlpha=a*wa*out*show*la*.16; ctx.fillStyle=JC[j]; ctx.fillRect(x0,y,x1-x0,h);
      ctx.globalAlpha=a*wa*out*show*la; ctx.strokeStyle=JC[j]; ctx.lineWidth=2; ctx.strokeRect(x0,y,x1-x0,h);
    });
  });
  ctx.restore();
}
function legend(a, sts){
  if(a<=0) return; ctx.save(); ctx.globalAlpha=a; ctx.textBaseline='middle'; ctx.font=`${MOBILE?13:16}px ${FONT}`;
  const keys=['gps','lseg','kpler',...(sts?['sts']:[])], gap=MOBILE?22:40, ws=keys.map(k=>22+ctx.measureText(SRC[k].n).width);
  let x=(W-ws.reduce((s,v)=>s+v,0)-gap*(keys.length-1))/2; const y=MOBILE?40:52;
  keys.forEach((k,i)=>{ ctx.fillStyle=SRC[k].c; ctx.beginPath(); ctx.roundRect(x,y-7,14,14,3); ctx.fill(); ctx.fillStyle=INK; ctx.fillText(SRC[k].n, x+22, y+1); x+=ws[i]+gap; });
  ctx.restore();
}

// ---------- the merged table for one journey ----------
function mergedTable(J, j, t0, t1, a, t){
  if(a<=0) return;
  // rows arrive in time order at a steady pace through the journey's dates, so dense Kpler stretches stream fast
  const rows=J.rows, n=rows.length, p=clamp((t-t0-1.0)/(t1-t0-2.2));
  J.days ??= rows.map(r=>(Date.parse(r[0].replace(' ','T')+'Z')-Date.UTC(2022,0,1))/864e5);
  const now=lerp(J.days[0], J.days[n-1]+.01, p); let shown=0; while(shown<n && J.days[shown]<=now) shown++;
  const x=M, w=W-2*M, y=Math.round(lanesBottom(t)+(MOBILE?90:110)), nRows=Math.floor((H-30-y)/L.trh)-1, cols=MOBILE?[0,.3,.6,.8,1]:[0,.2,.42,.56,.78,1], heads=MOBILE?['Ship','Date','Source','']:['Ship','Date','Source','Latitude','Longitude'];
  ctx.save(); ctx.globalAlpha=a; ctx.textBaseline='middle';
  ctx.font=`${MOBILE?13:17}px ${FONT}`;
  const c=Math.max(0,shown);
  const tx=c=>x+cols[c]*w;
  ctx.fillStyle='#f6f8fa'; ctx.fillRect(x,y,w,L.trh); ctx.fillStyle=LINE; ctx.fillRect(x,y+L.trh-1,w,1);
  ctx.fillStyle=INK; ctx.font=`bold ${L.tfs}px ${FONT}`; heads.forEach((h,k)=>ctx.fillText(h, tx(k)+12, y+L.trh/2+1));
  const first=Math.max(0, c-nRows);
  for(let k=0;k<nRows;k++){
    const r=rows[first+k]; if(!r || first+k>=c) break;
    const ry=y+(k+1)*L.trh, fresh=1;
    ctx.globalAlpha=a*(.35+.65*fresh);
    ctx.fillStyle=k%2?'#fff':'#f9fafb'; ctx.fillRect(x,ry,w,L.trh); ctx.fillStyle=LINE; ctx.fillRect(x,ry+L.trh-1,w,1);
    ctx.fillStyle=INK; ctx.font=`${L.tfs}px ${FONT}`;
    ctx.fillText(fitText(r[1], (cols[1]-cols[0])*w-20), tx(0)+12, ry+L.trh/2+1); ctx.fillText(r[0], tx(1)+12, ry+L.trh/2+1);
    const s=SRC[r[2]], pw=ctx.measureText(s.n).width+22; ctx.fillStyle=s.c; ctx.globalAlpha*=.14; ctx.beginPath(); ctx.roundRect(tx(2)+8, ry+6, pw, L.trh-12, 99); ctx.fill();
    ctx.globalAlpha=a*(.35+.65*fresh); ctx.fillStyle=r[2]==='kpler'?'#6e7781':s.c; ctx.font=`bold ${L.tfs-1}px ${FONT}`; ctx.fillText(s.n, tx(2)+19, ry+L.trh/2+1);
    if(!MOBILE){ ctx.fillStyle=INK; ctx.font=`${L.tfs}px ${FONT}`; ctx.fillText(r[3], tx(3)+12, ry+L.trh/2+1); ctx.fillText(r[4], tx(4)+12, ry+L.trh/2+1); }
  }
  ctx.restore();
  return c ? rows[c-1][0] : null;
}
function cursor(dateStr, a, t){             // a line on the timeline at the newest merged row's date
  if(!dateStr || a<=0) return;
  const d=(Date.parse(dateStr.replace(' ','T')+'Z')-Date.UTC(2022,0,1))/864e5, [d0,d1]=domainAt(t), x=L.tlX+(d-d0)/(d1-d0)*L.tlW;
  ctx.save(); ctx.globalAlpha=a; ctx.fillStyle=INK; ctx.fillRect(x-1, L.tlY+28, 2, lanesBottom(t)-L.tlY-18); ctx.restore();
}

// ---------- every journey, by source ----------
// Every merged point as a dot, one row per journey (coloured by source), which then flies to its spot on the QGIS map.
const IW=2634, IH=1680, IMS=Math.min((W-2*M)/IW, (H-2*M)/IH), IMX=(W-IW*IMS)/2, IMY=(H-IH*IMS)/2;
// dot grid: enough sub-rows that the biggest journey still fits the width
const SP = MOBILE?6:9, DLX = M+(MOBILE?48:64), MAXN = Math.max(...D.mix.map(([,m])=>Object.values(m).reduce((s,v)=>s+v,0)));
const K = Math.ceil(MAXN*SP/(W-DLX-14-M-(MOBILE?50:70)));
const DOTS = (()=>{
  const rows=D.mix.map(([j])=>j), y0=MOBILE?96:110, rh=(H-y0-(MOBILE?40:50))/rows.length, lx=DLX;
  const seen={};
  return D.points.map(([j,k,ix,iy],n)=>{
    const r=rows.indexOf(j), i=seen[j]=(seen[j]??-1)+1, col=Math.floor(i/K), sub=i%K;
    return {j, k, r, i, x0:lx+14+col*SP, y0:y0+r*rh+rh/2+(sub-(K-1)/2)*SP, x1:IMX+ix*IMS, y1:IMY+iy*IMS, seed:(n*2654435761%1000)/1000};
  });
})();
const hex = c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
const mix = (a,b,p)=>{ const A=hex(a), B=hex(b); return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*p)).join(',')})`; };
function dotsChart(t){
  const show=ease(prog(t,T.mix,.6)); if(show<=0) return;
  const rows=D.mix, y0=MOBILE?96:110, rh=(H-y0-(MOBILE?40:50))/rows.length, lx=M+(MOBILE?48:64), lab=1-ease(prog(t,T.fly,.5));
  ctx.save(); ctx.textBaseline='middle';
  if(lab>0) rows.forEach(([j,m],r)=>{
    const ra=show*lab*ease(prog(t,T.mix+.2+r*.06,.4)); if(ra<=0) return; ctx.globalAlpha=ra;
    ctx.fillStyle=JC[j]; ctx.font=`bold ${MOBILE?16:20}px ${FONT}`; ctx.textAlign='right'; ctx.fillText(`J${j}`, lx, y0+r*rh+rh/2); ctx.textAlign='left';
  });
  const fade=1-ease(prog(t,T.final+.9,.8)), rEnd=Math.max(1.6, 4.6*IMS);
  for(const d of DOTS){
    const ap=ease(prog(t, T.mix+.3+d.r*.06+d.i*.004, .35)); if(ap<=0) continue;
    const fp=ease(prog(t, T.fly+d.r*.03+d.seed*.35, 1.1));
    ctx.globalAlpha=ap*fade; ctx.fillStyle=mix(SRC[d.k].c, JC[d.j], fp);
    ctx.beginPath(); ctx.arc(lerp(d.x0,d.x1,fp), lerp(d.y0,d.y1,fp), lerp(MOBILE?2.3:3.1, rEnd, fp), 0, 7); ctx.fill();
  }
  ctx.restore();
}

function render(t){
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle=PAGE; ctx.fillRect(0,0,W,H);
  const ca=1-ease(prog(t,T.lanes,.7));
  CARDS.forEach((c,i)=>card(i, ca*ease(prog(t,T.cards+.2+i*.25,.5)), t));
  const la=ease(prog(t,T.lanes,.7))*(1-ease(prog(t,T.mix-.2,.6)));
  legend(Math.max(la, ease(prog(t,T.mix,.6))*(1-ease(prog(t,T.fly,.6)))), t>=T.events);
  drawTimeline(t, la);
  const a14=ease(prog(t,T.j14+.6,.6))*(1-ease(prog(t,T.mix-.2,.6)));
  cursor(mergedTable(D.j14,'14',T.j14,T.mix,a14,t), a14*.55, t);
  const fa=ease(prog(t,T.final,1.0));
  if(fa>0){ const s=Math.min((W-2*M)/FINAL.width, (H-2*M)/FINAL.height), w=FINAL.width*s, h=FINAL.height*s;
    ctx.save(); ctx.globalAlpha=fa; ctx.shadowColor='rgba(16,24,40,.12)'; ctx.shadowBlur=24; ctx.shadowOffsetY=6;
    ctx.beginPath(); ctx.roundRect((W-w)/2,(H-h)/2,w,h,16); ctx.fillStyle='#fff'; ctx.fill(); ctx.clip(); ctx.shadowColor='transparent';
    ctx.drawImage(FINAL,(W-w)/2,(H-h)/2,w,h); ctx.restore(); }
  dotsChart(t);
}

window.READY=false;
const stage = document.getElementById('stage'), ctrl = stage.querySelector('.controls'), bar = ctrl.querySelector('progress');
stage.style.setProperty('--ar', W/H); C.width = W; C.height = H;
let playing = false, ended = false, userPaused = false, now = 0, last = 0, hideT = 0;
const showControls=()=>{ stage.classList.add('show-controls'); clearTimeout(hideT); hideT=setTimeout(()=>stage.classList.remove('show-controls'),1500); };
const updateBar=()=>{ const p=Math.min(1,now/DUR); ctrl.style.setProperty('--progress',p.toFixed(4)); bar.value=p; };
function setState(s){ stage.dataset.state=s; stage.setAttribute('aria-label', s==='playing'?'Pause animation':s==='ended'?'Replay animation':'Play animation'); }
// Plays once and stops on the last frame; the control then shows a replay icon.
function tick(ts){
  if(!playing) return;
  now=Math.min(DUR, now+Math.max(0,ts-last)/1000); last=ts; render(now); updateBar();
  if(now>=DUR){ playing=false; ended=true; setState('ended'); return; }
  requestAnimationFrame(tick);
}
function setPlaying(p){
  if(p===playing) return;
  if(p && ended){ ended=false; now=0; }
  playing=p; setState(p?'playing':'paused');
  if(p){ last=performance.now(); requestAnimationFrame(tick); }
}
function seek(t){ now=Math.max(0,Math.min(DUR,t)); if(ended && now<DUR){ ended=false; setState('paused'); } render(now); updateBar(); }
function toggle(){ if(ended){ userPaused=false; setPlaying(true); } else { userPaused=playing; setPlaying(!playing); } showControls(); }
// Tap or click toggles; dragging sideways across the animation scrubs, like the site's video player.
let downT=0, downX=0, downY=0, scrubbing=false, resume=false;
stage.addEventListener('pointerdown', e=>{ downT=performance.now(); downX=e.clientX; downY=e.clientY; scrubbing=false; showControls(); });
stage.addEventListener('pointermove', e=>{
  showControls();
  if(!downT) return;
  const dx=e.clientX-downX, dy=e.clientY-downY;
  if(!scrubbing && Math.abs(dx)>6 && Math.abs(dx)>Math.abs(dy)){ scrubbing=true; resume=playing; setPlaying(false); stage.setPointerCapture(e.pointerId); }
  if(scrubbing){ const r=stage.getBoundingClientRect(); seek(DUR*(e.clientX-r.left)/r.width); }
});
stage.addEventListener('pointerup', ()=>{
  const tap=!scrubbing && performance.now()-downT<300; downT=0;
  if(scrubbing){ scrubbing=false; if(resume) setPlaying(true); else userPaused=true; return; }
  if(tap) toggle();
});
stage.addEventListener('pointercancel', ()=>{ downT=0; scrubbing=false; });
stage.addEventListener('click', e=>{ if(e.detail===0) toggle(); });
stage.addEventListener('keydown', e=>{ if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ e.preventDefault(); seek(now+(e.key==='ArrowRight'?5:-5)); showControls(); } });
FINAL.decode().catch(()=>{}).then(()=>document.fonts.ready).then(()=>{
  
  window.READY = true;
  if(location.hash.includes('static')) return render(0);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ seek(DUR); ended=true; setState('ended'); return; }
  render(0); updateBar();
  // Play only while at least half the animation is on screen; this also works inside an iframe embed.
  new IntersectionObserver(([e])=>{ if(!userPaused && !ended) setPlaying(e.isIntersecting); }, {threshold:.5}).observe(stage);
});
</script>
</body></html>
